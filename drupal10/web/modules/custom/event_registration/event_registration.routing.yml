event_registration.admin_form:
  path: '/admin/event-registration'
  defaults:
    _title: 'Event Configuration'
    _form: '\Drupal\event_registration\Form\EventConfigForm'
  requirements:
    _permission: 'administer event registration'

event_registration.list:
  path: '/admin/content/events'
  defaults:
    _controller: '\Drupal\event_registration\Controller\EventListController::list'
    _title: 'Event Registration System'
  requirements:
    _permission: 'administer event registration'

event_registration.register_form:
  path: '/event-register'
  defaults:
    _title: 'Register for Event'
    _form: '\Drupal\event_registration\Form\EventRegisterForm'
  requirements:
    _permission: 'register_for_events'

event_registration.registration_list:
  path: '/admin/content/event-registrations'
  defaults:
    _controller: '\Drupal\event_registration\Controller\EventRegistrationListController::list'
    _title: 'Event Registrations'
  requirements:
    _permission: 'administer event registration'
